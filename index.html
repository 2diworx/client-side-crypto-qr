<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR CryptoVault - Encrypted QR Code Generator</title>
  <style>
    :root {
      --bg: #0d0a0a;
      --card-bg: #1a1212;
      --card-border: #331f1f;
      --input-bg: #0d0a0a;
      --input-border: #442626;
      --text-main: #f5e6e6;
      --text-muted: #a68a8a;
      --accent: #ff4d4d;
      --accent-hover: #e60000;
      --success: #10b981;
      --danger: #ff3333;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .vault-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 77, 77, 0.05);
      transition: max-width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .vault-card.expanded {
      max-width: 820px;
    }

    .brand-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      position: relative;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid rgba(255, 77, 77, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .brand-title-wrap {
      text-align: left;
      flex: 1;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 0.68rem;
      font-weight: 600;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-info {
      background: rgba(255, 77, 77, 0.12);
      color: var(--accent);
      border: 1px solid rgba(255, 77, 77, 0.25);
    }

    .tabs {
      display: flex;
      background: var(--bg);
      padding: 3px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--card-border);
    }

    .tab {
      flex: 1;
      padding: 8px;
      text-align: center;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--card-bg);
      color: var(--accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      transition: all 0.35s ease;
    }

    .vault-card.expanded #sub-encrypt {
      grid-template-columns: 1fr 1fr;
    }

    .full-width {
      width: 100%;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="password"], input[type="text"], textarea {
      width: 100%;
      padding: 11px 13px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea {
      resize: vertical;
      height: 90px;
      min-height: 70px;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 77, 77, 0.2);
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      cursor: pointer;
      font-weight: 600;
    }
    .toggle-pass:hover { color: var(--text-main); }

    .btn {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: #0d0a0a;
      font-weight: 700;
      font-size: 0.88rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: var(--accent-hover); color: #fff; }
    .btn:active { transform: scale(0.99); }

    .error-msg {
      color: var(--danger);
      font-size: 0.78rem;
      margin-top: 8px;
      text-align: center;
      min-height: 16px;
    }

    .output-side {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .vault-card.expanded .output-side {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }

    .qr-frame {
      background: #ffffff;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-frame svg {
      width: 180px;
      height: 180px;
      display: block;
    }

    .qr-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      width: 100%;
    }

    .btn-dl {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 7px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-dl:hover { border-color: var(--accent); color: var(--accent); }

    .btn-action-full {
      margin-top: 8px;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-action-full:hover { color: var(--text-main); border-color: var(--accent); }

    .output-container {
      margin-top: 14px;
      width: 100%;
      text-align: left;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      width: 100%;
    }

    .output-header label {
      margin-bottom: 0;
    }

    .output-box {
      display: block;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      word-break: break-all;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      color: var(--accent);
      text-align: left;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
    }

    .btn-copy {
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-copy:hover { color: var(--text-main); border-color: var(--accent); }

    .hidden { display: none !important; }

    @media (max-width: 680px) {
      .vault-card.expanded {
        max-width: 480px;
      }
      .vault-card.expanded #sub-encrypt {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <!-- Standard compliant QR code generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>

<div class="vault-card" id="main-card">
  <div class="brand-header">
    <div class="brand-icon">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
    </div>
    <div class="brand-title-wrap">
      <h1>QR CryptoVault</h1>
      <p class="subtitle" id="vault-subtitle">Client-Side AES-256-GCM Protection</p>
    </div>
    <div id="url-badge" class="badge badge-info hidden">Encrypted Link Detected</div>
  </div>

  <!-- AUTO DECRYPT MODE -->
  <div id="section-auto-decrypt" class="full-width hidden">
    <div class="form-group">
      <label for="auto-pass">Master Password</label>
      <div class="input-wrapper">
        <input type="password" id="auto-pass" placeholder="Enter password to decrypt content">
        <button class="toggle-pass" type="button" onclick="togglePass('auto-pass')">SHOW</button>
      </div>
    </div>
    <button class="btn" onclick="handleAutoDecrypt()">Decrypt Content</button>
    <div id="auto-dec-error" class="error-msg"></div>

    <div id="auto-dec-result" class="output-container hidden">
      <div class="output-header">
        <label>Decrypted Output</label>
        <button class="btn-copy" onclick="copyText('auto-decrypted-text', this)">Copy Output</button>
      </div>
      <div class="output-box" id="auto-decrypted-text"></div>
    </div>
  </div>

  <!-- MANUAL ENCRYPT & DECRYPT TABBED MODE -->
  <div id="section-standard">
    <div class="tabs">
      <button class="tab active" id="tab-enc" onclick="switchTab('encrypt')">Encrypt Content</button>
      <button class="tab" id="tab-dec" onclick="switchTab('decrypt')">Decrypt Content</button>
    </div>

    <!-- ENCRYPT TAB -->
    <div id="sub-encrypt" class="grid-container">
      <div class="form-side">
        <div class="form-group">
          <label for="secret-input">Confidential Data</label>
          <textarea id="secret-input" placeholder="Enter recovery phrases, private notes, or sensitive keys..."></textarea>
        </div>
        <div class="form-group">
          <label for="enc-pass">Master Password</label>
          <div class="input-wrapper">
            <input type="password" id="enc-pass" placeholder="Enter a secure master password">
            <button class="toggle-pass" type="button" onclick="togglePass('enc-pass')">SHOW</button>
          </div>
        </div>
        <button class="btn" onclick="handleEncrypt()">Generate Secure QR Code</button>
        <div id="enc-error" class="error-msg"></div>
      </div>

      <!-- QR OUTPUT PANEL -->
      <div id="qr-output" class="output-side">
        <div id="qr-frame" class="qr-frame"></div>

        <div id="qr-actions-container" style="width: 100%;">
          <div class="qr-actions">
            <button class="btn-dl" onclick="downloadPNG()">Download PNG</button>
            <button class="btn-dl" onclick="downloadSVG()">Download SVG</button>
          </div>
          <button class="btn-action-full" onclick="copyPayload(this)">Copy Encrypted Payload</button>
          <button class="btn-action-full" style="margin-top: 6px;" onclick="previewWebLink()">Preview Web Link ↗</button>
        </div>
      </div>
    </div>

    <!-- DECRYPT TAB -->
    <div id="sub-decrypt" class="hidden full-width">
      <div class="form-group">
        <label for="dec-payload">Encrypted Data or Link</label>
        <textarea id="dec-payload" placeholder="Paste encrypted code (VAULT:...) or full link here..."></textarea>
      </div>
      <div class="form-group">
        <label for="dec-pass">Master Password</label>
        <div class="input-wrapper">
          <input type="password" id="dec-pass" placeholder="Enter master password">
          <button class="toggle-pass" type="button" onclick="togglePass('dec-pass')">SHOW</button>
        </div>
      </div>
      <button class="btn" onclick="handleDecrypt()">Decrypt Content</button>
      <div id="dec-error" class="error-msg"></div>

      <div id="dec-result" class="output-container hidden">
        <div class="output-header">
          <label>Decrypted Output</label>
          <button class="btn-copy" onclick="copyText('manual-decrypted-text', this)">Copy Output</button>
        </div>
        <div class="output-box" id="manual-decrypted-text"></div>
      </div>
    </div>

  </div>
</div>

<script>
  const ITERATIONS = 600000;
  let currentSvgString = "";
  let hasGeneratedQr = false;
  let rawVaultPayload = "";

  window.addEventListener('DOMContentLoaded', () => {
    checkUrlHash();
  });

  window.addEventListener('hashchange', () => {
    checkUrlHash();
  });

  function checkUrlHash() {
    if (window.location.hash.startsWith('#VAULT:')) {
      document.getElementById('section-standard').classList.add('hidden');
      document.getElementById('section-auto-decrypt').classList.remove('hidden');
      document.getElementById('url-badge').classList.remove('hidden');
      document.getElementById('vault-subtitle').innerText = "Encrypted content detected from link";
      document.getElementById('main-card').classList.remove('expanded');
    }
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    
    if (tab === 'encrypt') {
      document.getElementById('tab-enc').classList.add('active');
      document.getElementById('sub-encrypt').classList.remove('hidden');
      document.getElementById('sub-decrypt').classList.add('hidden');

      if (hasGeneratedQr) {
        document.getElementById('main-card').classList.add('expanded');
      }
    } else {
      document.getElementById('tab-dec').classList.add('active');
      document.getElementById('sub-decrypt').classList.remove('hidden');
      document.getElementById('sub-encrypt').classList.add('hidden');

      document.getElementById('main-card').classList.remove('expanded');
    }
  }

  function togglePass(inputId) {
    const el = document.getElementById(inputId);
    const btn = el.nextElementSibling;
    if (el.type === 'password') {
      el.type = 'text';
      btn.innerText = 'HIDE';
    } else {
      el.type = 'password';
      btn.innerText = 'SHOW';
    }
  }

  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: ITERATIONS, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  // Safe chunked conversion avoiding call-stack limits
  function bufferToBase64(buf) {
    const bytes = new Uint8Array(buf);
    let binary = '';
    const chunkSize = 8192;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      const chunk = bytes.subarray(i, i + chunkSize);
      binary += String.fromCharCode.apply(null, chunk);
    }
    return btoa(binary);
  }

  function base64ToBuffer(b64) {
    let normalized = b64.replace(/-/g, '+').replace(/_/g, '/');
    while (normalized.length % 4) normalized += '=';
    const binary = atob(normalized);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
  }

  async function handleEncrypt() {
    const secret = document.getElementById('secret-input').value;
    const password = document.getElementById('enc-pass').value;
    const errDiv = document.getElementById('enc-error');

    errDiv.innerText = '';

    if (!secret || !password) {
      errDiv.innerText = 'Please provide both confidential data and a master password.';
      return;
    }

    try {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(password, salt);

      const enc = new TextEncoder();
      const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(secret));

      const combined = new Uint8Array(16 + 12 + ciphertext.byteLength);
      combined.set(salt, 0);
      combined.set(iv, 16);
      combined.set(new Uint8Array(ciphertext), 28);

      const b64Data = bufferToBase64(combined);
      rawVaultPayload = `VAULT:${b64Data}`;

      hasGeneratedQr = true;
      document.getElementById('main-card').classList.add('expanded');

      renderOutputPanel();
    } catch(e) {
      console.error(e);
      errDiv.innerText = "Encryption process failed. Please try again.";
    }
  }

  function renderOutputPanel() {
    if (!hasGeneratedQr) return;

    const qrFrame = document.getElementById('qr-frame');
    const baseUrl = window.location.href.split('#')[0];
    const fullWebUrl = `${baseUrl}#${rawVaultPayload}`;

    // Auto-detect version (0 = auto) with Medium error correction
    const qr = qrcode(0, 'M');
    qr.addData(fullWebUrl);
    qr.make();

    // Fix: Pass numeric parameters (cellSize = 6, margin = 4) instead of an object
    currentSvgString = qr.createSvgTag(6, 4);

    // Inject valid XML namespace attributes if missing
    if (!currentSvgString.includes('xmlns=')) {
      currentSvgString = currentSvgString.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
    }

    qrFrame.innerHTML = currentSvgString;
  }

  function previewWebLink() {
    if (!rawVaultPayload) return;
    const baseUrl = window.location.href.split('#')[0];
    const fullWebUrl = `${baseUrl}#${rawVaultPayload}`;
    window.open(fullWebUrl, '_blank');
  }

  function downloadSVG() {
    if (!currentSvgString) return;
    const blob = new Blob([currentSvgString], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "QR_CryptoVault.svg";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  function downloadPNG() {
    if (!currentSvgString) return;
    const img = new Image();
    const svgBlob = new Blob([currentSvgString], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(svgBlob);

    img.onload = () => {
      const canvas = document.createElement("canvas");
      const size = 1000;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, 0, 0, size, size);

      const pngUrl = canvas.toDataURL("image/png");
      const link = document.createElement("a");
      link.href = pngUrl;
      link.download = "QR_CryptoVault.png";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    };

    img.src = url;
  }

  function copyPayload(btn) {
    navigator.clipboard.writeText(rawVaultPayload).then(() => {
      const originalText = btn.innerText;
      btn.innerText = 'Copied to Clipboard';
      btn.style.color = 'var(--success)';
      btn.style.borderColor = 'var(--success)';
      setTimeout(() => {
        btn.innerText = originalText;
        btn.style.color = '';
        btn.style.borderColor = '';
      }, 1500);
    });
  }

  async function handleAutoDecrypt() {
    const password = document.getElementById('auto-pass').value;
    const errDiv = document.getElementById('auto-dec-error');
    const resultDiv = document.getElementById('auto-dec-result');
    const textOutput = document.getElementById('auto-decrypted-text');

    errDiv.innerText = '';
    resultDiv.classList.add('hidden');

    if (!password) {
      errDiv.innerText = 'Please enter your master password.';
      return;
    }

    try {
      const b64Str = window.location.hash.replace("#VAULT:", "");
      const combined = base64ToBuffer(b64Str);
      const salt = combined.slice(0, 16);
      const iv = combined.slice(16, 28);
      const ciphertext = combined.slice(28);

      const key = await deriveKey(password, salt);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);

      textOutput.innerText = new TextDecoder().decode(decrypted);
      resultDiv.classList.remove('hidden');
    } catch(e) {
      errDiv.innerText = 'Decryption failed: Incorrect password or invalid data.';
    }
  }

  async function handleDecrypt() {
    let rawInput = document.getElementById('dec-payload').value.trim();
    const password = document.getElementById('dec-pass').value;
    const errDiv = document.getElementById('dec-error');
    const resultDiv = document.getElementById('dec-result');
    const textOutput = document.getElementById('manual-decrypted-text');

    errDiv.innerText = '';
    resultDiv.classList.add('hidden');

    if (!rawInput || !password) {
      errDiv.innerText = 'Please enter both the encrypted content and password.';
      return;
    }

    try {
      if (rawInput.includes("#VAULT:")) rawInput = rawInput.split('#VAULT:')[1];
      else if (rawInput.startsWith("VAULT:")) rawInput = rawInput.replace("VAULT:", "");

      const combined = base64ToBuffer(rawInput);
      const salt = combined.slice(0, 16);
      const iv = combined.slice(16, 28);
      const ciphertext = combined.slice(28);

      const key = await deriveKey(password, salt);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);

      textOutput.innerText = new TextDecoder().decode(decrypted);
      resultDiv.classList.remove('hidden');
    } catch(e) {
      errDiv.innerText = 'Decryption failed: Verification failed or password incorrect.';
    }
  }

  function copyText(elementId, btn) {
    const textToCopy = document.getElementById(elementId).innerText;
    navigator.clipboard.writeText(textToCopy).then(() => {
      const originalText = btn.innerText;
      btn.innerText = 'Copied';
      btn.style.color = 'var(--success)';
      btn.style.borderColor = 'var(--success)';
      setTimeout(() => {
        btn.innerText = originalText;
        btn.style.color = '';
        btn.style.borderColor = '';
      }, 1500);
    });
  }
</script>

</body>
</html>
